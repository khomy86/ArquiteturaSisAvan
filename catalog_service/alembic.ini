# Migrations run automatically when the catalog service starts. This file is
# for running Alembic by hand, from the repository root, for example:
#
#   DATABASE_URL=postgresql://ualflix:ualflix@localhost:5432/ualflix \
#       alembic -c catalog_service/alembic.ini revision --autogenerate -m "add column"
#
# The database URL comes from DATABASE_URL (see catalog_service/config.py).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

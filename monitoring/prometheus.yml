global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'catalog-service'
    static_configs:
      - targets: ['catalog-service:8000']

  - job_name: 'streaming-service'
    static_configs:
      - targets: ['streaming-service:8001']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] 
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'catalog-service'
    static_configs:
      - targets: ['catalog-service-1:8000', 'catalog-service-2:8000']

  - job_name: 'streaming-service'
    static_configs:
      - targets: ['streaming-service-1:8001', 'streaming-service-2:8001']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090'] 
services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost/api
      - REACT_APP_STREAMING_URL=http://localhost/stream
      - WATCHPACK_POLLING=true
    depends_on:
      - loadbalancer

  loadbalancer:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - catalog-service-1
      - catalog-service-2
      - streaming-service-1
      - streaming-service-2

  catalog-service-1:
    build:
      context: .
      dockerfile: docker/catalog_service.Dockerfile
    container_name: catalog-service-1
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ualflix
      - REDIS_URL=redis://redis:6379
      - NODE_ID=1
    depends_on:
      - db
      - redis

  catalog-service-2:
    build:
      context: .
      dockerfile: docker/catalog_service.Dockerfile
    container_name: catalog-service-2
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ualflix
      - REDIS_URL=redis://redis:6379
      - NODE_ID=2
    depends_on:
      - db
      - redis

  streaming-service-1:
    build:
      context: .
      dockerfile: docker/streaming_service.Dockerfile
    container_name: streaming-service-1
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - NODE_ID=1
    volumes:
      - video_storage:/app/videos
    depends_on:
      - minio

  streaming-service-2:
    build:
      context: .
      dockerfile: docker/streaming_service.Dockerfile
    container_name: streaming-service-2
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - NODE_ID=2
    volumes:
      - video_storage:/app/videos
    depends_on:
      - minio

  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ualflix
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount custom pg_hba.conf to allow replication connections
      - ./postgres_config/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
      # Optional: Mount custom postgresql.conf if needed later
      # - ./postgres_config/postgresql.conf:/var/lib/postgresql/data/postgresql.conf
    ports:
      - "5432:5432" # Primary DB port
    # Command to enable replication settings
    command:
      - "bash"
      - "-c"
      - |
        chown -R postgres:postgres /var/lib/postgresql/data
        gosu postgres bash -c "
        postgres -c wal_level=replica -c max_wal_senders=10 -c hot_standby=on &
        sleep 10
        echo '>>> Creating replication slots...'
        psql -U postgres -d ualflix -c \"SELECT pg_create_physical_replication_slot('replica_slot');\" || true
        psql -U postgres -d ualflix -c \"SELECT pg_create_physical_replication_slot('replica_slot_2');\" || true
        wait
        "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s

  db-replica-1:
    image: postgres:14
    container_name: db-replica-1
    environment:
      # Important: Replica needs PGDATA set explicitly when using init commands
      - PGDATA=/var/lib/postgresql/data/pgdata_replica
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data # Separate volume for replica
    ports:
      - "5433:5432" # Expose replica on a different host port
    depends_on:
      db:
        condition: service_healthy # Wait for primary to be healthy
    # Command to remove initial data, clone from primary, and start standby
    # Use PGPASSWORD environment variable for pg_basebackup
    command: >
      bash -c "echo '>>> Cleaning replica data...' &&
               rm -rf /var/lib/postgresql/data/pgdata_replica/* &&
               echo '>>> Starting pg_basebackup...' &&
               export PGPASSWORD=postgres &&
               pg_basebackup -h db -U postgres -D /var/lib/postgresql/data/pgdata_replica -Xs -R --no-password --slot=replica_slot &&
               echo '>>> pg_basebackup finished.' &&
               unset PGPASSWORD &&
               echo '>>> Starting replica server as postgres user...' &&
               chown -R postgres:postgres /var/lib/postgresql/data/pgdata_replica && # Ensure correct ownership
               su postgres -s /bin/bash -c "/usr/lib/postgresql/14/bin/postgres -D /var/lib/postgresql/data/pgdata_replica -c hot_standby=on"
      " # Closing quote for bash -c
    # Note: Assumes primary postgres user has replication privileges and slot exists.
    # Primary needs: Adjust pg_hba.conf if necessary for password auth from replica IP.

  db-replica-2:
    image: postgres:14
    container_name: db-replica-2
    environment:
      # Important: Replica needs PGDATA set explicitly when using init commands
      - PGDATA=/var/lib/postgresql/data/pgdata_replica_2
    volumes:
      - postgres_replica_2_data:/var/lib/postgresql/data # Separate volume for replica 2
    ports:
      - "5434:5432" # Expose replica 2 on a different host port
    depends_on:
      db:
        condition: service_healthy # Wait for primary to be healthy
    # Command to remove initial data, clone from primary, and start standby
    # Use PGPASSWORD environment variable for pg_basebackup
    command: >
      bash -c "echo '>>> Cleaning replica 2 data...' &&
               rm -rf /var/lib/postgresql/data/pgdata_replica_2/* &&
               echo '>>> Starting pg_basebackup for replica 2...' &&
               export PGPASSWORD=postgres &&
               pg_basebackup -h db -U postgres -D /var/lib/postgresql/data/pgdata_replica_2 -Xs -R --no-password --slot=replica_slot_2 &&
               echo '>>> pg_basebackup for replica 2 finished.' &&
               unset PGPASSWORD &&
               echo '>>> Starting replica 2 server as postgres user...' &&
               chown -R postgres:postgres /var/lib/postgresql/data/pgdata_replica_2 && # Ensure correct ownership
               su postgres -s /bin/bash -c "/usr/lib/postgresql/14/bin/postgres -D /var/lib/postgresql/data/pgdata_replica_2 -c hot_standby=on"
      " # Closing quote for bash -c

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"



  admin_panel:
    build:
      context: .
      dockerfile: docker/admin_panel.Dockerfile
    # Optional: Expose a different host port if needed, e.g., 3002
    # ports:
    #   - "3002:3000"
    # Environment variables for the admin panel (e.g., API URL if different)
    environment:
      - REACT_APP_API_URL=http://localhost/api # Reuse existing API endpoint
      - WATCHPACK_POLLING=true # Can likely remove this too
    # Optional: Mount volumes for development (like the web service)
    # volumes:
    #   - ./admin_panel:/app
    #   - /app/node_modules
    depends_on:
      - loadbalancer # Depends on Nginx to be accessible

volumes:
  postgres_data:
  postgres_replica_data: # Add volume for replica
  postgres_replica_2_data:
  redis_data:
  minio_data:
  video_storage: 
x-catalog-service: &catalog-service
  build:
    context: .
    dockerfile: docker/catalog_service.Dockerfile
  image: localhost/ualflix-catalog:latest
  environment:
    DATABASE_URL: postgresql://ualflix:${POSTGRES_PASSWORD:-ualflix}@db:5432/ualflix
    REDIS_URL: redis://redis:6379
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-the-env-file}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    ROOT_PATH: /api
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
    minio:
      condition: service_started
  restart: unless-stopped

x-streaming-service: &streaming-service
  build:
    context: .
    dockerfile: docker/streaming_service.Dockerfile
  image: localhost/ualflix-streaming:latest
  environment:
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  depends_on:
    - minio
  restart: unless-stopped

x-db-replica: &db-replica
  image: docker.io/library/postgres:16
  entrypoint: ["bash", "/usr/local/bin/replica-entrypoint.sh"]
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  loadbalancer:
    image: docker.io/library/nginx:1.28-alpine
    # nginx's default SIGQUIT waits for open connections to finish, and the
    # server-sent event streams never do. SIGTERM closes them straight away;
    # browsers reconnect on their own.
    stop_signal: SIGTERM
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro,z
    depends_on:
      - web
      - admin_panel
      - catalog-service-1
      - catalog-service-2
      - streaming-service-1
      - streaming-service-2
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped

  admin_panel:
    build:
      context: .
      dockerfile: docker/admin_panel.Dockerfile
    restart: unless-stopped

  catalog-service-1: *catalog-service
  catalog-service-2: *catalog-service

  streaming-service-1: *streaming-service
  streaming-service-2: *streaming-service

  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: ualflix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ualflix}
      POSTGRES_DB: ualflix
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_config/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro,z
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Checked over TCP: during first-time init the server only listens on the
      # Unix socket, and the standbys need TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ualflix -d ualflix"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db-replica-1:
    <<: *db-replica
    environment:
      PRIMARY_HOST: db
      REPLICATION_SLOT: replica_1
      PGPASSWORD: ${REPLICATION_PASSWORD:-replicator}
    volumes:
      - postgres_replica_1_data:/var/lib/postgresql/data
      - ./postgres_config/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro,z
    ports:
      - "127.0.0.1:5433:5432"

  db-replica-2:
    <<: *db-replica
    environment:
      PRIMARY_HOST: db
      REPLICATION_SLOT: replica_2
      PGPASSWORD: ${REPLICATION_PASSWORD:-replicator}
    volumes:
      - postgres_replica_2_data:/var/lib/postgresql/data
      - ./postgres_config/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro,z
    ports:
      - "127.0.0.1:5434:5432"

  redis:
    image: docker.io/library/redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    # MinIO stopped publishing community images after this release.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_replica_1_data:
  postgres_replica_2_data:
  redis_data:
  minio_data:

version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://loadbalancer:80/api
      - REACT_APP_STREAMING_URL=http://loadbalancer:80/stream
    depends_on:
      - loadbalancer

  loadbalancer:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - catalog-service-1
      - catalog-service-2
      - streaming-service-1
      - streaming-service-2

  catalog-service-1:
    build:
      context: .
      dockerfile: docker/catalog_service.Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ualflix
      - REDIS_URL=redis://redis:6379
      - NODE_ID=1
    depends_on:
      - db
      - redis

  catalog-service-2:
    build:
      context: .
      dockerfile: docker/catalog_service.Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ualflix
      - REDIS_URL=redis://redis:6379
      - NODE_ID=2
    depends_on:
      - db
      - redis

  streaming-service-1:
    build:
      context: .
      dockerfile: docker/streaming_service.Dockerfile
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - NODE_ID=1
    volumes:
      - video_storage:/app/videos
    depends_on:
      - minio

  streaming-service-2:
    build:
      context: .
      dockerfile: docker/streaming_service.Dockerfile
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - NODE_ID=2
    volumes:
      - video_storage:/app/videos
    depends_on:
      - minio

  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ualflix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  minio_data:
  video_storage:
  prometheus_data:
  grafana_data: 
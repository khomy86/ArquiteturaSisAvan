# Serves a built React app. Unknown paths fall back to index.html so that
# client-side routes survive a page refresh.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Build output under static/ has content hashes in the file names.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

events {
    worker_connections 1024;
}

http {
    upstream catalog_services {
        server catalog-service-1:8000;
        server catalog-service-2:8000;
    }

    upstream streaming_services {
        server streaming-service-1:8001;
        server streaming-service-2:8001;
    }

    server {
        listen 80;
        client_max_body_size 100M; # Allow uploads up to 100MB

        # Health check endpoint
        location /health {
            return 200 'healthy\n';
        }

        # API routes
        location /api/ {
            proxy_pass http://catalog_services/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable keepalive connections
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # --- BEGIN CORS HANDLING ---
            # Handle OPTIONS requests (preflight)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000; # Cache preflight response for 20 days
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204; # No Content for OPTIONS
            }

            # Add CORS headers to actual requests (GET, POST, etc.)
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            # --- END CORS HANDLING ---
        }

        # Streaming routes
        location /stream/ {
            proxy_pass http://streaming_services/stream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable keepalive connections
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Enable streaming
            proxy_buffering off;
            proxy_request_buffering off;

            # --- BEGIN CORS HANDLING ---
            # Add CORS headers to allow requests from any origin (adjust if needed for production)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always; # Allow GET for streaming, OPTIONS for preflight
            add_header 'Access-Control-Allow-Headers' 'Range, Origin, X-Requested-With, Content-Type, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            # Add CORP header to allow cross-origin embedding of the video
            add_header 'Cross-Origin-Resource-Policy' 'cross-origin' always;

            # Handle OPTIONS requests (preflight for CORS)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            # --- END CORS HANDLING ---
        }
    }
} 
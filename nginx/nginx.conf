events {
    worker_connections 1024;
}

http {
    upstream catalog_services {
        server catalog-service-1:8000;
        server catalog-service-2:8000;
    }

    upstream streaming_services {
        server streaming-service-1:8001;
        server streaming-service-2:8001;
    }

    server {
        listen 80;

        # Health check endpoint
        location /health {
            return 200 'healthy\n';
        }

        # API routes
        location /api/ {
            proxy_pass http://catalog_services/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable keepalive connections
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Streaming routes
        location /stream/ {
            proxy_pass http://streaming_services/stream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable keepalive connections
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Timeout settings
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Enable streaming
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
} 